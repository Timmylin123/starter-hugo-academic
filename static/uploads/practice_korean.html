<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Korean Pronunciation Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f7f7f7;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:hover {
      background: #555;
    }

    #practiceBox, #hintBox, #resultBox {
      margin-top: 30px;
      font-size: 22px;
    }

    #koreanChar {
      font-size: 80px;
      margin: 30px;
    }

    input {
      font-size: 24px;
      padding: 10px;
      width: 250px;
      text-align: center;
    }

    #feedbackBox {
      min-height: 36px;
      margin-top: 18px;
      font-size: 24px;
      font-weight: bold;
    }

    .correct {
      color: #1f7a3f;
    }

    .incorrect {
      color: #b42318;
    }

    .rule {
      text-align: left;
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Korean Pronunciation Practice</h1>

  <button onclick="startAlphabetPractice()">Practice</button>
  <button onclick="startBasicConsonantsPractice()">Practice Basic Consonants</button>
  <button onclick="startDoubleConsonantsPractice()">Practice Double Consonants</button>
  <button onclick="startSimpleVowelsPractice()">Practice Simple Vowels</button>
  <button onclick="startCompoundVowelsPractice()">Practice Compound Vowels</button>
  <button onclick="showHints()">Hint</button>
  <button onclick="startRandomHangulLettersPractice()">Practice 10 Random Hangul Letters</button>
  <button onclick="startLyricsHangulPractice()">Testing 10 Random Hangul Letters</button>

  <div id="practiceBox" style="display:none;">
    <div id="progress"></div>
    <div id="koreanChar"></div>
    <input 
      id="answerInput" 
      type="text" 
      placeholder="Type romanization"
      onkeydown="checkEnter(event)"
    />
    <div id="feedbackBox"></div>
  </div>

  <div id="resultBox"></div>

  <div id="hintBox" style="display:none;"></div>

  <script>
    const koreanList = [
      { char: "가", roman: "ga" },
      { char: "나", roman: "na" },
      { char: "다", roman: "da" },
      { char: "라", roman: "ra" },
      { char: "마", roman: "ma" },
      { char: "바", roman: "ba" },
      { char: "사", roman: "sa" },
      { char: "아", roman: "a" },
      { char: "자", roman: "ja" },
      { char: "차", roman: "cha" },
      { char: "카", roman: "ka" },
      { char: "타", roman: "ta" },
      { char: "파", roman: "pa" },
      { char: "하", roman: "ha" },
      { char: "고", roman: "go" },
      { char: "누", roman: "nu" },
      { char: "미", roman: "mi" },
      { char: "소", roman: "so" },
      { char: "주", roman: "ju" },
      { char: "해", roman: "hae" }
    ];

    const basicConsonants = [
      { char: "ㄱ", roman: "g/k", answers: ["g", "k"], english: "g or k sound" },
      { char: "ㄴ", roman: "n", english: "n sound" },
      { char: "ㄷ", roman: "d/t", answers: ["d", "t"], english: "d or t sound" },
      { char: "ㄹ", roman: "r/l", answers: ["r", "l"], english: "r or l sound" },
      { char: "ㅁ", roman: "m", english: "m sound" },
      { char: "ㅂ", roman: "b/p", answers: ["b", "p"], english: "b or p sound" },
      { char: "ㅅ", roman: "s", english: "s sound" },
      { char: "ㅇ", roman: "silent at start / ng at end", answers: ["silent", "ng", "none"], english: "silent at the start of a syllable, ng at the end" },
      { char: "ㅈ", roman: "j", english: "j sound" },
      { char: "ㅊ", roman: "ch", english: "ch sound" },
      { char: "ㅋ", roman: "k", english: "strong k sound" },
      { char: "ㅌ", roman: "t", english: "strong t sound" },
      { char: "ㅍ", roman: "p", english: "strong p sound" },
      { char: "ㅎ", roman: "h", english: "h sound" }
    ];

    const doubleConsonants = [
      { char: "ㄲ", roman: "kk", english: "tense kk sound" },
      { char: "ㄸ", roman: "tt", english: "tense tt sound" },
      { char: "ㅃ", roman: "pp", english: "tense pp sound" },
      { char: "ㅆ", roman: "ss", english: "tense ss sound" },
      { char: "ㅉ", roman: "jj", english: "tense jj sound" }
    ];

    const simpleVowels = [
      { char: "ㅏ", roman: "a", english: "a as in father" },
      { char: "ㅑ", roman: "ya", english: "ya sound" },
      { char: "ㅓ", roman: "eo", english: "eo, like aw/uh" },
      { char: "ㅕ", roman: "yeo", english: "yeo sound" },
      { char: "ㅗ", roman: "o", english: "o as in go" },
      { char: "ㅛ", roman: "yo", english: "yo sound" },
      { char: "ㅜ", roman: "u", english: "u as in moon" },
      { char: "ㅠ", roman: "yu", english: "yu sound" },
      { char: "ㅡ", roman: "eu", english: "eu, a flat u sound" },
      { char: "ㅣ", roman: "i", english: "ee sound" }
    ];

    const compoundVowels = [
      { char: "ㅐ", roman: "ae", english: "ae, like eh" },
      { char: "ㅔ", roman: "e", english: "e, like eh" },
      { char: "ㅒ", roman: "yae", english: "yae sound" },
      { char: "ㅚ", roman: "oe", english: "oe, often pronounced we" },
      { char: "ㅟ", roman: "wi", english: "wi sound" },
      { char: "ㅢ", roman: "ui", english: "ui sound" },
      { char: "ㅘ", roman: "wa", english: "wa sound" },
      { char: "ㅙ", roman: "wae", english: "wae sound" },
      { char: "ㅝ", roman: "wo", english: "wo sound" },
      { char: "ㅞ", roman: "we", english: "we sound" },
      { char: "ㅖ", roman: "ye", english: "ye sound" }
    ];

    const alphabetList = [
      ...basicConsonants,
      ...doubleConsonants,
      ...simpleVowels,
      ...compoundVowels
    ];

    const lyricsHangulDictionary = {
      "가": "ga",
      "각": "gak",
      "간": "gan",
      "감": "gam",
      "강": "gang",
      "거": "geo",
      "게": "ge",
      "겨": "gyeo",
      "결": "gyeol",
      "계": "gye",
      "고": "go",
      "그": "geu",
      "기": "gi",
      "길": "gil",
      "까": "kka",
      "께": "kke",
      "껴": "kkyeo",
      "꾸": "kku",
      "끝": "kkeut",
      "끼": "kki",
      "낌": "kkim",
      "나": "na",
      "난": "nan",
      "내": "nae",
      "너": "neo",
      "널": "neol",
      "네": "ne",
      "녕": "nyeong",
      "눈": "nun",
      "느": "neu",
      "는": "neun",
      "다": "da",
      "대": "dae",
      "던": "deon",
      "도": "do",
      "되": "doe",
      "드": "deu",
      "든": "deun",
      "들": "deul",
      "따": "tta",
      "떨": "tteol",
      "라": "ra",
      "랑": "rang",
      "래": "rae",
      "러": "reo",
      "렇": "reoh",
      "려": "ryeo",
      "로": "ro",
      "를": "reul",
      "리": "ri",
      "린": "rin",
      "림": "rim",
      "마": "ma",
      "만": "man",
      "많": "manh",
      "말": "mal",
      "맘": "mam",
      "매": "mae",
      "멈": "meom",
      "모": "mo",
      "미": "mi",
      "바": "ba",
      "반": "ban",
      "밤": "bam",
      "버": "beo",
      "벽": "byeok",
      "변": "byeon",
      "별": "byeol",
      "복": "bok",
      "봐": "bwa",
      "부": "bu",
      "빛": "bi",
      "사": "sa",
      "상": "sang",
      "생": "saeng",
      "서": "seo",
      "선": "seon",
      "세": "se",
      "속": "so",
      "수": "su",
      "순": "sun",
      "숨": "sum",
      "스": "seu",
      "슬": "seul",
      "시": "si",
      "싶": "sip",
      "아": "a",
      "안": "an",
      "않": "an",
      "알": "al",
      "앞": "ap",
      "야": "ya",
      "어": "eo",
      "언": "eon",
      "없": "eop",
      "에": "e",
      "오": "o",
      "와": "wa",
      "왔": "wat",
      "요": "yo",
      "우": "u",
      "운": "un",
      "울": "ul",
      "움": "um",
      "으": "eu",
      "은": "eun",
      "을": "eul",
      "음": "eum",
      "의": "ui",
      "이": "i",
      "임": "im",
      "입": "i",
      "적": "jeok",
      "전": "jeon",
      "제": "je",
      "젠": "jen",
      "져": "jyeo",
      "주": "ju",
      "줘": "jwo",
      "지": "ji",
      "직": "jik",
      "진": "jin",
      "쫓": "jjot",
      "처": "cheo",
      "춰": "chwo",
      "치": "chi",
      "친": "chin",
      "켜": "kyeo",
      "특": "teuk",
      "포": "po",
      "픈": "peun",
      "픔": "peum",
      "필": "pil",
      "하": "ha",
      "한": "han",
      "할": "hal",
      "함": "ham",
      "해": "hae",
      "향": "hyang",
      "헤": "he",
      "홀": "hol",
      "후": "hu",
      "흩": "heut",
      "희": "hui"
    };

    const lyricsHangulList = Object.entries(lyricsHangulDictionary).map(([char, roman]) => ({
      char,
      roman
    }));

    let quiz = [];
    let currentIndex = 0;
    let score = 0;
    let answers = [];
    let waitingForNextQuestion = false;

    function startPractice() {
      document.getElementById("hintBox").style.display = "none";
      document.getElementById("resultBox").innerHTML = "";
      document.getElementById("practiceBox").style.display = "block";

      quiz = shuffleList(koreanList).slice(0, 10);
      resetQuiz();
    }

    function startAlphabetPractice() {
      startPracticeSet(alphabetList);
    }

    function startRandomHangulLettersPractice() {
      startPracticeSet(koreanList, 10);
    }

    function startLyricsHangulPractice() {
      startPracticeSet(lyricsHangulList, 10);
    }

    function startBasicConsonantsPractice() {
      startPracticeSet(basicConsonants);
    }

    function startDoubleConsonantsPractice() {
      startPracticeSet(doubleConsonants);
    }

    function startSimpleVowelsPractice() {
      startPracticeSet(simpleVowels);
    }

    function startCompoundVowelsPractice() {
      startPracticeSet(compoundVowels);
    }

    function startPracticeSet(list, limit = list.length) {
      document.getElementById("hintBox").style.display = "none";
      document.getElementById("resultBox").innerHTML = "";
      document.getElementById("practiceBox").style.display = "block";

      quiz = shuffleList(list).slice(0, limit);
      resetQuiz();
    }

    function shuffleList(list) {
      const shuffled = [...list];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function resetQuiz() {
      currentIndex = 0;
      score = 0;
      answers = [];
      waitingForNextQuestion = false;

      showQuestion();
    }

    function showQuestion() {
      const item = quiz[currentIndex];

      document.getElementById("progress").innerText =
        `Question ${currentIndex + 1} of ${quiz.length}`;

      document.getElementById("koreanChar").innerText = item.char;
      document.getElementById("answerInput").value = "";
      document.getElementById("answerInput").disabled = false;
      document.getElementById("feedbackBox").innerText = "";
      document.getElementById("feedbackBox").className = "";
      waitingForNextQuestion = false;
      document.getElementById("answerInput").focus();
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    }

    function checkAnswer() {
      if (waitingForNextQuestion) {
        return;
      }

      const input = document.getElementById("answerInput").value.trim().toLowerCase();
      const current = quiz[currentIndex];
      const correct = current.roman;
      const acceptedAnswers = current.answers || [correct];
      const isCorrect = acceptedAnswers.includes(input);
      const feedbackBox = document.getElementById("feedbackBox");
      const answerInput = document.getElementById("answerInput");

      speakKorean(current.char);

      if (isCorrect) {
        score++;
      }

      feedbackBox.innerText = `${isCorrect ? "Correct!" : "Not quite."} ${current.char} = ${correct}${current.english ? ` (${current.english})` : ""}`;
      feedbackBox.className = isCorrect ? "correct" : "incorrect";
      answerInput.disabled = true;
      waitingForNextQuestion = true;

      answers.push({
        char: current.char,
        yourAnswer: input,
        correctAnswer: correct,
        english: current.english,
        correct: isCorrect
      });

      currentIndex++;

      if (currentIndex < quiz.length) {
        setTimeout(showQuestion, 1400);
      } else {
        setTimeout(showResults, 1400);
      }
    }

    function speakKorean(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 0.7;
      speechSynthesis.speak(utterance);
    }

    function showResults() {
      document.getElementById("practiceBox").style.display = "none";

      let html = `<h2>Your Score: ${score} / ${quiz.length}</h2>`;
      html += `<div class="rule">`;

      answers.forEach(item => {
        html += `
          <p>
            <strong>${item.char}</strong> —
            Your answer: ${item.yourAnswer || "(blank)"} |
            Correct: ${item.correctAnswer}
            ${item.english ? `(${item.english})` : ""}
            ${item.correct ? "✅" : "❌"}
          </p>
        `;
      });

      html += `</div>`;
      document.getElementById("resultBox").innerHTML = html;
    }

    function showHints() {
      document.getElementById("practiceBox").style.display = "none";
      document.getElementById("resultBox").innerHTML = "";

      const hints = `
        <div class="rule">
          <h2>Practice Answers: 40 Korean Romanizations</h2>

          <h3>1. Korean syllables are built from blocks</h3>
          <p>Each Korean character is usually made from consonants and vowels.</p>
          <p>Example: ㄱ + ㅏ = 가, pronounced “ga”.</p>

          <h3>2. Basic consonants</h3>
          <p>
            ㄱ = g/k<br>
            ㄴ = n<br>
            ㄷ = d/t<br>
            ㄹ = r/l<br>
            ㅁ = m<br>
            ㅂ = b/p<br>
            ㅅ = s<br>
            ㅇ = silent at the start / ng at the end<br>
            ㅈ = j<br>
            ㅊ = ch<br>
            ㅋ = k<br>
            ㅌ = t<br>
            ㅍ = p<br>
            ㅎ = h
          </p>

          <h3>3. Double consonants</h3>
          <p>
            ㄲ = kk<br>
            ㄸ = tt<br>
            ㅃ = pp<br>
            ㅆ = ss<br>
            ㅉ = jj
          </p>

          <h3>4. Simple vowels</h3>
          <p>
            ㅏ = a<br>
            ㅑ = ya<br>
            ㅓ = eo<br>
            ㅕ = yeo<br>
            ㅗ = o<br>
            ㅛ = yo<br>
            ㅜ = u<br>
            ㅠ = yu<br>
            ㅡ = eu<br>
            ㅣ = i
          </p>

          <h3>5. Compound vowels</h3>
          <p>
            ㅐ = ae<br>
            ㅔ = e<br>
            ㅒ = yae<br>
            ㅚ = oe<br>
            ㅟ = wi<br>
            ㅢ = ui<br>
            ㅘ = wa<br>
            ㅙ = wae<br>
            ㅝ = wo<br>
            ㅞ = we<br>
            ㅖ = ye
          </p>

          <h3>6. ㅇ is silent at the beginning</h3>
          <p>For song romanization, 아 is pronounced “a”, not “nga”. When ㅇ is at the bottom of a syllable, it sounds like “ng”.</p>

          <h3>7. Final consonants can sound different</h3>
          <p>Some consonants change sound when they appear at the bottom of a syllable. You can learn this later after basic pronunciation.</p>
        </div>
      `;

      document.getElementById("hintBox").innerHTML = hints;
      document.getElementById("hintBox").style.display = "block";
    }
  </script>

</body>
</html>
